import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.10'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.10'
    id 'org.springframework.boot' version '3.1.5' apply false
    id 'io.spring.dependency-management' version '1.1.3'
    id 'maven-publish'
    id 'java-library'
}

group = 'com.crp.libs'
version = '1.0.0'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
}

dependencies {
    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.kafka:kafka-clients'
    
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    
    // Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
    
    // JSON processing
    implementation 'com.google.code.gson:gson:2.8.9'
    
    // Annotations
    compileOnly 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'io.mockk:mockk:1.13.5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

tasks.withType(KotlinCompile) {
    kotlinOptions {
        freeCompilerArgs += '-Xjsr305=strict'
        jvmTarget = '17'
    }
}

// GitHub Packages publication
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            groupId = 'com.github.kostasfilios'
            artifactId = 'crypto-kafka-lib'
            version = project.version
            
            pom {
                name = 'Crypto Kafka Library'
                description = 'Kafka integration and messaging library for CRP system'
                url = 'https://github.com/ExchangesSystem/crypto-kafka-lib'
                
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                
                developers {
                    developer {
                        id = 'kostasfilios'
                        name = 'Konstantinos Filios'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/ExchangesSystem/crypto-kafka-lib.git'
                    developerConnection = 'scm:git:ssh://github.com/ExchangesSystem/crypto-kafka-lib.git'
                    url = 'https://github.com/ExchangesSystem/crypto-kafka-lib'
                }
            }
        }
    }
    
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/ExchangesSystem/crypto-kafka-lib"
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}