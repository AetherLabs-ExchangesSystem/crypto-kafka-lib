import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.8.22'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.8.22'
    id 'org.springframework.boot' version '3.3.1' apply false
    id 'io.spring.dependency-management' version '1.1.3'
    id 'maven-publish'
    id 'java-library'
}

group = 'com.crp.libs'
version = '1.3.1'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // The oldest Boot line the services run (3.1-3.3): compiling against it keeps the lib off newer
        // spring-kafka (3.0) and kafka-clients (3.4) APIs.
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.1.5'
    }
}

dependencies {
    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.kafka:kafka-clients'
    
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework:spring-context'
    
    // Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'

    // JSON for the event publisher's default serializer (the version the services use)
    implementation 'com.google.code.gson:gson:2.8.9'

    // Metrics: only used when the service has Micrometer and a MeterRegistry bean
    compileOnly 'io.micrometer:micrometer-core'
    
    // Optional durable MySQL provider; callers supply their existing R2DBC runtime and driver.
    compileOnly 'org.springframework:spring-r2dbc'
    compileOnly 'org.springframework:spring-tx'
    compileOnly 'io.projectreactor:reactor-core'

    // Annotations
    compileOnly 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'io.micrometer:micrometer-core'
    testImplementation 'org.springframework:spring-r2dbc'
    testImplementation 'org.springframework:spring-tx'
    testImplementation 'io.asyncer:r2dbc-mysql:1.0.5'
}

tasks.withType(KotlinCompile) {
    kotlinOptions {
        freeCompilerArgs += ['-Xjsr305=strict', '-Xjvm-default=all-compatibility']
        jvmTarget = '17'
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

def withoutR2dbc = { file ->
    !['spring-r2dbc', 'r2dbc-', 'reactor-core', 'reactive-streams'].any { file.name.startsWith(it) }
}

tasks.named('test') {
    classpath = sourceSets.test.runtimeClasspath.filter(withoutR2dbc)
    exclude '**/durable/mysql/**'
    exclude '**/nomicrometer/**'
    exclude '**/nordbc/**'
}

// The lib must load and work in a service without Micrometer: run that test with micrometer-core
// (and the actuator, which brings it) removed from the classpath.
def testWithoutMicrometer = tasks.register('testWithoutMicrometer', Test) {
    description = 'Runs the no-Micrometer tests with micrometer-core and the actuator removed from the classpath.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter(withoutR2dbc).filter { file ->
        !['micrometer-core', 'micrometer-jakarta9', 'spring-boot-actuator', 'HdrHistogram', 'LatencyUtils'].any { file.name.startsWith(it) }
    }
    include '**/nomicrometer/**'
}

tasks.named('check') {
    dependsOn testWithoutMicrometer
}

// JitPack publication
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

// Existing services must still load without the optional database provider runtime.
def testWithoutR2dbc = tasks.register('testWithoutR2dbc', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter(withoutR2dbc)
    include '**/nordbc/**'
}
tasks.named('check') { dependsOn testWithoutR2dbc }

def durableMysqlTest = tasks.register('durableMysqlTest', Test) {
    description = 'Opt-in real MySQL durability tests with optional provider dependencies.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/durable/mysql/**'
}
tasks.named('check') { dependsOn durableMysqlTest }
